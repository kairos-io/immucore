#cloud-config
# Minimal userdata for boot tests: creates a login user for the serial getty.
# Use with: USERDATA=tests/qemu/userdata-login.yaml LOGIN_USER=kairos LOGIN_PASS=kairos

stages:
  initramfs:
    - name: "Set user and password"
      users:
        kairos:
          passwd: "kairos"
          groups:
            - "admin"
